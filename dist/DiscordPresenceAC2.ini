[DiscordPresenceAC2]
; Application ID from https://discord.com/developers/applications
; Discord shows the name of that application after "Playing"
ApplicationId=1561367578553753731

; Language of the presence text
; Supported values: auto (Windows language), de, en
; Default - auto
Language=auto

; Big picture: an asset key uploaded under Rich Presence > Art Assets, or an image URL. Only edit if you know what are you doing
; Default - ac2_logo
LargeImage=ac2_logo
LargeText=Assassin's Creed II

; Shows the elapsed play time
; Supported values: 0 - off, 1 - on
; Default - 1
ShowElapsedTime=1

; Shows the current sequence and memory (Steam/Uplay version of the game only)
; Supported values: 0 - off, 1 - on
; Default - 1
ShowProgress=1

; Shows the nearest landmark while free roaming, like "Near Ponte Rialto" (Steam/Uplay version only)
; Supported values: 0 - off, 1 - on
; Default - 1
ShowLandmark=1

; Shows florins and health (Steam/Uplay version of the game only)
; Supported values: 0 - off, 1 - on
; Default - 1
ShowStats=1

; Writes DiscordPresenceAC2.log into the scripts folder, useful for troubleshooting
; Supported values: 0 - off, 1 - on
; Default - 0
DebugLog=0

; Development only: writes a full memory dump of the game on every F9 press (about 1 GB each)
; Supported values: 0 - off, 1 - on
; Default - 0
DumpProcess=0

; Optional text overrides per language
;
; Details, State and LargeText are the two lines and the picture hover text. Placeholders:
;   {region} {region_info} {sequence} {memory} {exploring} {landmark} {florins} {health} {health_max}
; {sequence} and {memory} only have a value while a memory is played,
; {exploring} and {landmark} only while free roaming
; Lines are split into parts at " · ", a part is hidden while one of its placeholders has no value
; Defaults (DE):
;   Details={region} · Sequenz {sequence} · Nahe {landmark}
;   State=Erinnerung {memory} · {exploring} · {florins} ƒ · ❤ {health}/{health_max}
;   LargeText={region_info}
;   Exploring=Freies Erkunden
;
; Region names, format: Key=Name|Info
; Keys: Idle, TitleScreen, WhiteRoom, Abstergo, Hideout, Firenze, Toscana, Villa, Venezia, Roma,
; Wetlands, Mountains, Altair_Memory, LGS01_Duomo ... LGS10_Visitazione
; Example: Firenze=Unterwegs in Florenz|Ezio Auditore
[Text_DE]

