name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        shell: cmd
        run: build.bat

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/scripts | Out-Null
          Copy-Item build/DiscordPresenceAC2.asi, build/DiscordPresenceAC2.ini package/scripts/
          Copy-Item README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath DiscordPresenceAC2.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DiscordPresenceAC2
          path: package/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DiscordPresenceAC2.zip
          generate_release_notes: true
    permissions:
      contents: write
